[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sprites-openai-agents"
version = "0.1.0"
description = "Sprites sandbox provider for the OpenAI Agents SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Sprites Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "openai-agents>=0.18.2,<0.19",
    "sprites-py>=0.3,<0.4",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.11",
]

[project.urls]
Homepage = "https://sprites.dev"
Repository = "https://github.com/superfly/sprites-py"
Issues = "https://github.com/superfly/sprites-py/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sprites_openai_agents = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["sprites_openai_agents"]
known-third-party = ["agents", "sprites"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
packages = ["sprites_openai_agents"]
