[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sprites-py"
version = "0.6.0"
description = "Python SDK for Fly.io Sprites: computers for agents. Sprite management, remote command execution, filesystems, checkpoints, services, and network policy from Python."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = [
    "sprites",
    "fly-io",
    "ai-agents",
    "agent-sandbox",
    "sandbox",
    "microvm",
    "remote-execution",
    "checkpoint-restore",
]
authors = [
    {name = "Sprites Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.25.0",
    "websockets>=14.0",
    # Human-vs-agent client signals (Fly-Client-* headers + User-Agent suffix).
    "client-signals>=0.4.4",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.0,<2",
    "ruff>=0.11",
]

[project.scripts]
sprites-cli = "sprites.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.9"
follow_imports = "skip"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
